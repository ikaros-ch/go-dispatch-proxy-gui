name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve version string
        # Tag pushes use the tag itself (v0.1.3); manual runs fall back to the
        # branch name so artifacts are still distinguishable.
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: "386"
            base: go-dispatch-proxy.win.x86
            ext: .exe
          - goos: windows
            goarch: amd64
            base: go-dispatch-proxy.win.x64
            ext: .exe
          - goos: linux
            goarch: "386"
            base: go-dispatch-proxy.linux.x86
            ext: ""
          - goos: linux
            goarch: amd64
            base: go-dispatch-proxy.linux.x64
            ext: ""
    env:
      ASSET: ${{ matrix.base }}-${{ needs.meta.outputs.version }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "$ASSET" ./cmd/cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  gui-linux:
    name: Build GUI (linux/amd64)
    needs: meta
    runs-on: ubuntu-latest
    env:
      ASSET: go-dispatch-proxy-gui.linux.x64-${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build GUI
        working-directory: gui
        run: wails build -tags webkit2_41 -clean
      - name: Rename artifact
        run: mv gui/build/bin/gui "gui/build/bin/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: gui/build/bin/${{ env.ASSET }}

  gui-windows:
    name: Build GUI (windows/amd64)
    needs: meta
    runs-on: windows-latest
    env:
      ASSET: go-dispatch-proxy-gui.win.x64-${{ needs.meta.outputs.version }}.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build GUI
        working-directory: gui
        run: wails build -clean
      - name: Rename artifact
        run: Rename-Item gui/build/bin/gui.exe "$env:ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: gui/build/bin/${{ env.ASSET }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, gui-linux, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
