name: Debug Windows build

# Produces a console-attached debug build of the GUI so startup errors are
# visible (the normal release exe is GUI-subsystem and prints nothing).
# Download the artifact from the run page, then launch it from a terminal.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gui-windows-debug:
    name: Build GUI (windows/amd64, debug console)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build GUI (debug, console attached)
        working-directory: gui
        run: wails build -debug -windowsconsole -clean
      - name: Rename artifact
        run: Rename-Item gui/build/bin/gui.exe go-dispatch-proxy-gui.win.x64-debug.exe
      - uses: actions/upload-artifact@v4
        with:
          name: go-dispatch-proxy-gui.win.x64-debug
          path: gui/build/bin/go-dispatch-proxy-gui.win.x64-debug.exe
